<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Amazon Product Analyzer Settings</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 400px;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }

    .container {
      background: white;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
    }

    h1 {
      font-size: 20px;
      margin-bottom: 8px;
      color: #2d3748;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .subtitle {
      font-size: 13px;
      color: #718096;
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      color: #2d3748;
      margin-bottom: 8px;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 10px 12px;
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      font-size: 14px;
      transition: border-color 0.2s;
      font-family: inherit;
    }

    input[type="text"]:focus,
    input[type="password"]:focus {
      outline: none;
      border-color: #667eea;
    }

    .help-text {
      font-size: 12px;
      color: #718096;
      margin-top: 6px;
      line-height: 1.4;
    }

    .help-text a {
      color: #667eea;
      text-decoration: none;
    }

    .help-text a:hover {
      text-decoration: underline;
    }

    button {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
    }

    button:active {
      transform: translateY(0);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .status {
      margin-top: 16px;
      padding: 12px;
      border-radius: 8px;
      font-size: 13px;
      text-align: center;
      display: none;
    }

    .status.success {
      background: #f0fdf4;
      border: 1px solid #86efac;
      color: #166534;
      display: block;
    }

    .status.error {
      background: #fef2f2;
      border: 1px solid #fca5a5;
      color: #991b1b;
      display: block;
    }

    .info-box {
      background: #eff6ff;
      border: 1px solid #93c5fd;
      border-radius: 8px;
      padding: 12px;
      margin-top: 20px;
    }

    .info-box h3 {
      font-size: 14px;
      color: #1e40af;
      margin-bottom: 8px;
    }

    .info-box ol {
      margin-left: 18px;
      font-size: 12px;
      color: #1e40af;
      line-height: 1.6;
    }

    .info-box li {
      margin-bottom: 4px;
    }

    .toggle-password {
      position: relative;
    }

    .toggle-password-btn {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #718096;
      cursor: pointer;
      padding: 4px;
      font-size: 12px;
      width: auto;
      box-shadow: none;
    }

    .toggle-password-btn:hover {
      color: #2d3748;
      transform: translateY(-50%);
      box-shadow: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🤖 Amazon Analyzer</h1>
    <p class="subtitle">Configure your Gemini API key</p>

    <form id="settingsForm">
      <div class="form-group">
        <label for="apiKey">Gemini API Key</label>
        <div class="toggle-password">
          <input 
            type="password" 
            id="apiKey" 
            name="apiKey" 
            placeholder="Enter your Gemini API key"
            autocomplete="off"
          >
          <button type="button" class="toggle-password-btn" id="togglePassword">Show</button>
        </div>
        <p class="help-text">
          Get your free API key from 
          <a href="https://aistudio.google.com/app/apikey" target="_blank">Google AI Studio</a>
        </p>
      </div>

      <button type="submit" id="saveBtn">Save API Key</button>
    </form>

    <div id="status" class="status"></div>

    <div class="info-box">
      <h3>How to use:</h3>
      <ol>
        <li>Get a free Gemini API key from Google AI Studio</li>
        <li>Paste your API key above and save</li>
        <li>Visit any Amazon product page</li>
        <li>The AI analysis will appear automatically!</li>
      </ol>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
